services:
  - type: web
    name: openclaw
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: node dist/index.js gateway --port 8080 --bind lan
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_STATE_DIR
        value: /tmp/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /tmp/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENCLAW_CONFIG_PATH
        value: /app/deploy/render-openclaw.json
